name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: HTML에 Amplitude 값 주입 (dist/ 생성)
        env:
          AMPLITUDE_PROJECT_ID: ${{ vars.AMPLITUDE_PROJECT_ID }}
          AMPLITUDE_API_KEY: ${{ vars.AMPLITUDE_API_KEY }}
        run: bash build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
